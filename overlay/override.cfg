; Melvor Idle 2 简体中文翻译（非官方）
; 把本文件和 mod 文件夹放到 Melvor2.exe 旁边。不要修改 Melvor2.exe。
; 叠放方式参考 bmlee9527 / YukoCat 的繁体中文社区包（https://github.com/bmlee9527/melvor-idle-2-zh-tw）。
; 本文件加载 mod/zh_CN.po（语系 zh_CN，语言菜单会出现「简体中文」），
; 并在启动时自动运行 mod/zh_CN_patch.gd。
; 官方 PCK 内的 Locale/zh_CN.po 不会被加载；请不要改成 res://Locale/zh_CN.po。

[autoload]

ZhCNPatch="*res://mod/zh_CN_patch.gd"

[internationalization]

locale/translations=PackedStringArray("res://Locale/en_GB.po", "res://mod/zh_CN.po")
